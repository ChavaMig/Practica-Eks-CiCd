apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturas-frontend
  labels:
    app: temperaturas
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: temperaturas
      tier: frontend
  template:
    metadata:
      labels:
        app: temperaturas
        tier: frontend
    spec:
      containers:
      - name: contenedor-temperaturas
        image: mm98zgz/temperaturas-frontend:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: TEMP_SERVER
          value: "temperaturas-backend:5000"
